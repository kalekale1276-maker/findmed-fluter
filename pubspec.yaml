name: findmed
description: A healthcare facility finder mobile application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  get_it: ^7.6.4

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Navigation
  go_router: ^12.1.3

  # Utilities
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  intl: ^0.20.2
  logger: ^2.0.2+1
  permission_handler: ^11.1.0

  # Location & Maps
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0
  latlong2: ^0.9.1
  flutter_map: ^6.1.0

  # URL & App Settings
  url_launcher: ^6.2.1
  app_settings: ^5.1.1

  # Socket & Real-time
  socket_io_client: ^2.0.3+1

  # Image & Camera
  image_picker: ^1.0.4
  file_picker: ^6.1.1

  # Authentication
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.15.3
  # google_sign_in: ^6.2.1

  # Notifications
  # flutter_local_notifications: ^16.3.0
  # firebase_messaging: ^14.7.6

  # Security
  crypto: ^3.0.3

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_intl:
  enabled: true
  class_name: S
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/generated
